[[bench]]
harness = false
name = "bench"
path = "benches/bench.rs"

[dependencies]
log = { optional = true, version = "0.4" }
serde = { features = ["derive"], optional = true, version = "1" }
unicode-id = { features = ["no_std"], version = "0.3" }

[dev-dependencies]
criterion = "0.5"
env_logger = "0.11"
pretty_assertions = { workspace = true }
serde_json = { version = "1" }
swc_core = { version = "22", features = [
  "common",
  "ecma_ast",
  "ecma_parser",
  "ecma_visit",
] }

[features]
default = []
json = ["serde"]
log = ["dep:log"]
serde = ["dep:serde"]

[package]
authors = ["Titus Wormer <tituswormer@gmail.com>", "Hakan Serce"]
categories = ["compilers", "encoding", "parser-implementations", "parsing", "text-processing"]
description = "CompMD's fork of markdown-rs: the CommonMark compliant markdown parser, with the syntax of CompMD (Component Markdown)"
edition = "2018"
homepage = "https://compmd.hakanserce.com/"
include = ["src/", "license", "readme.md"]
keywords = ["commonmark", "markdown", "compmd", "parser", "components"]
license = "MIT"
# Published as `compmd-markdown`; the library keeps the name `markdown`, as upstream's.
name = "compmd-markdown"
readme = "readme.md"
repository = "https://github.com/comp-markdown/markdown-rs"
rust-version = "1.56"
version = "0.1.0"

[lib]
name = "markdown"

[workspace]
members = ["generate", "mdast_util_to_markdown"]

[workspace.dependencies]
pretty_assertions = "1"
